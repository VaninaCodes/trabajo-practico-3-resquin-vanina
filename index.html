<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avenida Siempreviva</title>
    <!-- Links css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Avenida Siempreviva</h1>
      <h3>Base de datos de Springfield</h3>
    </header>

    <!-- Nav con buscador -->
    <nav class="navbar">
      <div class="container-fluid d-flex justify-content-center">
        <a class="navbar-brand" href="index.html">
          <img src="assets/img/nav-logo.jfif" alt="logo" width="200" />
        </a>
        <form class="d-flex" role="search">
          <input
            class="form-control form-control-lg me-2"
            type="search"
            placeholder="Busca un personaje (Ej: Lisa)"
            style="min-width: 320px"
            id="inputBuscador"
          />
          <button class="btn btn-warning btn-lg" id="btnBuscador" type="submit">
            Buscar
          </button>
        </form>
      </div>
    </nav>

    <!-- Main -->
    <main>
      <!-- Seccion cartas -->
      <section>
        <div class="row" id="rowCartas"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copyVanina Resquin, 2026</p>
      <p>21st Century Fox</p>
      <p>Todos los derechos reservados</p>
    </footer>

    <!-- Links js -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
